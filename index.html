<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stopwatch</title>
<!-- all the page styling lives in styles.css -->
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- the stopwatch card in the middle of the page -->
<div class="card">
  <!-- the title -->
  <h1><span>◷</span> Stopwatch</h1>
  <!-- the big time display -->
  <div id="display">00:00<small>.000</small></div>
  <!-- the small state label (Ready / Running / Stopped) -->
  <div id="state">Ready</div>
  <!-- the Start, Lap and Reset buttons -->
  <div class="controls">
    <button id="startBtn" type="button">Start</button>
    <button id="lapBtn" type="button">Lap</button>
    <button id="resetBtn" type="button">Reset</button>
  </div>
  <!-- the laps table (filled in by the code as you hit Lap) -->
  <div id="laps"><div id="empty">No laps yet — hit Lap while running.</div></div>
</div>
<!-- all the page logic lives in app.js -->
<script src="app.js"></script>
</body>
</html>
